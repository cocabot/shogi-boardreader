name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tests/make-fixtures.mjs
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - if: github.event_name == 'push' && contains(github.event.head_commit.message, '[quick-ui]')
        run: npx playwright test --project=webkit-iphone -g 'visible viewport'
      - if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[quick-ui]')
        run: npx playwright test --project=webkit-iphone
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: test-build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
