<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#232d29" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="将棋BoardReader" />
  <title>将棋 BoardReader</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" class="app">
    <section id="readerPanel" class="panel reader-panel" aria-label="PDFリーダー">
      <header class="toolbar reader-toolbar">
        <label class="file-button"><input id="pdfFile" aria-label="PDFを開く" type="file" accept="application/pdf,.pdf" /><span>PDFを開く</span></label>
        <div class="page-controls" aria-label="ページ操作">
          <button id="prevPage" type="button" aria-label="前のページ">‹</button>
          <label class="page-label"><input id="pageNumber" type="number" min="1" value="1" inputmode="numeric" aria-label="ページ番号" /><span>/ <span id="pageCount">—</span></span></label>
          <button id="nextPage" type="button" aria-label="次のページ">›</button>
        </div>
        <div class="zoom-controls" aria-label="拡大縮小">
          <button id="zoomOut" type="button" aria-label="縮小">−</button>
          <button id="fitWidth" type="button">幅</button>
          <button id="zoomIn" type="button" aria-label="拡大">＋</button>
        </div>
      </header>
      <div id="pdfStage" class="pdf-stage">
        <div id="pdfEmpty" class="empty-state"><span class="eyebrow">SHOGI BOARDREADER</span><strong>本をひらく。手をならべる。</strong><span>上に将棋本、下にあなたの研究盤。</span><small>PDF・棋譜は端末内で処理し、送信しません。</small></div>
        <canvas id="pdfCanvas" hidden aria-label="PDFページ"></canvas>
      </div>
      <div class="pdf-info">
        <span id="pdfStatus" role="status">端末内のPDFを選択</span>
        <details class="pdf-help"><summary>表示設定</summary><div><label><input type="checkbox" id="pdfCompat" /> 文字互換表示</label><p>文字が欠ける場合に切り替えてください。埋め込みフォントを輪郭で描画します。</p><a id="nativePdf" hidden target="_blank" rel="noopener">Safariで開く</a><small>元のPDFを端末内で開きます。未埋め込みの特殊な駒文字は復元できない場合があります。</small></div></details>
      </div>
    </section>
    <div id="splitter" class="splitter" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="上下の表示割合を変更" aria-valuemin="20" aria-valuemax="70" aria-valuenow="34">
      <span class="splitter-hint">本</span><span class="splitter-grip"></span><span class="splitter-hint">盤</span>
      <button id="splitHalf" type="button" aria-label="50対50に戻す">50:50</button>
    </div>
    <section id="boardPanel" class="panel board-panel" aria-label="将棋盤">
      <header class="board-header">
        <label class="file-button secondary"><input id="recordFile" type="file" aria-label="棋譜を開く" accept=".kif,.ki2,.kifu,.ki2u,.csa,text/plain" /><span>棋譜を開く</span></label>
        <span id="boardMode" class="mode-label">自由盤</span>
        <button id="recordListButton" type="button" disabled>棋譜一覧</button>
      </header>
      <div id="goteHand" class="hand hand-top" aria-label="後手の持ち駒"></div>
      <div class="board-wrap"><div class="board-frame"><div id="fileLabels" class="file-labels" aria-hidden="true"></div><div id="rankLabels" class="rank-labels" aria-hidden="true"></div><div id="board" class="board" role="grid" aria-label="将棋盤"></div></div></div>
      <div id="senteHand" class="hand hand-bottom" aria-label="先手の持ち駒"></div>
      <div class="playback" aria-label="棋譜再生"><button id="firstMove" disabled>先頭</button><button id="prevMove" disabled>前の手</button><output id="moveCount" aria-live="polite">自由盤</output><button id="nextMove" disabled>次の手</button><button id="lastMove" disabled>最後</button></div>
      <footer class="board-controls"><button id="undo">↶ 待った</button><button id="redo">↷ やり直し</button><button id="flip">⇅ 反転</button><button id="reset">初期局面</button></footer>
      <div id="promotionBar" class="promotion-bar" hidden><span>成りますか？</span><button id="promoteYes">成る</button><button id="promoteNo">不成</button></div>
    </section>
  </main>
  <dialog id="recordDialog" aria-labelledby="recordTitle"><header><h2 id="recordTitle">棋譜一覧</h2><button id="closeRecord" aria-label="棋譜一覧を閉じる">閉じる</button></header><p id="recordName"></p><p id="recordMessage" role="status"></p><div class="record-actions"><button id="studyPosition">この局面で検討</button><button id="resumeRecord" hidden>棋譜に戻る</button><button id="mainLine">本譜に戻る</button></div><p class="record-guide">手をタップして移動。分岐のある手は「変化」から選べます。</p><ol id="moveList"></ol></dialog>
  <dialog id="messageDialog" aria-labelledby="messageTitle"><h2 id="messageTitle">棋譜を開けませんでした</h2><p id="messageText"></p><button id="closeMessage">閉じる</button></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
